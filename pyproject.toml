readme = "README.md"
authors = [
    { name = "Cocoslavelaz", email = "jeffrey881226@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "finmind>=2.0.9",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-core>=1.6.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "ta-lib>=0.8.0",
